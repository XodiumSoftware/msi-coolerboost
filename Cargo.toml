[package]
name = "msi-coolerboost"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "msi-coolerboost"
path = "src/bin/tray.rs"

[[bin]]
name = "msi-coolerboost-toggle"
path = "src/bin/toggle.rs"

[dependencies]
ksni = { version = "0.3", features = ["blocking"] }
dirs = "6"
notify-rust = { version = "4.18.0", default-features = false, features = ["d"] }

[profile.release]
opt-level = 3
lto = true
strip = true
